<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Rider</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #F8FAFC;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748B;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1E293B;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            background: #F8FAFC;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #F97316;
        }
        .btn-add {
            width: 100%;
            padding: 15px;
            background: #F97316;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.4);
        }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            display: none;
        }
        .message.success {
            display: block;
            background: #F0FDF4;
            color: #166534;
            border-left: 4px solid #22C55E;
        }
        .message.error {
            display: block;
            background: #FEF2F2;
            color: #991B1B;
            border-left: 4px solid #EF4444;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0EA5E9;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .note {
            font-size: 13px;
            color: #94A3B8;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👤 Add New Rider</h1>
    <p class="subtitle">Register a real rider so they appear in delivery quotes.</p>

    <div class="form-group">
        <label for="riderName">Full Name</label>
        <input type="text" id="riderName" placeholder="e.g. Musa Bello" />
    </div>

    <div class="form-group">
        <label for="riderPhone">Phone Number</label>
        <input type="text" id="riderPhone" placeholder="e.g. 08012345678" />
    </div>

    <div class="form-group">
        <label for="riderVehicle">Vehicle Type</label>
        <select id="riderVehicle">
            <option value="Bike">Bike (Okada)</option>
            <option value="Van">Van (Keke/Pickup)</option>
            <option value="Car">Car (Sedan/SUV)</option>
        </select>
    </div>

    <button class="btn-add" id="addRiderBtn">➕ Add Rider to System</button>

    <div id="responseMessage" class="message"></div>

    <a href="/" class="back-link">← Back to Homepage</a>
    <p class="note">Note: Riders appear instantly in the "Get Quotes" section once added.</p>
</div>

<script>
    document.getElementById('addRiderBtn').addEventListener('click', async function() {
        const name = document.getElementById('riderName').value.trim();
        const phone = document.getElementById('riderPhone').value.trim();
        const vehicle = document.getElementById('riderVehicle').value;

        const messageDiv = document.getElementById('responseMessage');
        
        // Hide previous messages
        messageDiv.style.display = 'none';
        messageDiv.className = 'message';

        // Validate inputs
        if (!name || !phone || !vehicle) {
            messageDiv.textContent = '⚠️ Please fill in all fields.';
            messageDiv.className = 'message error';
            messageDiv.style.display = 'block';
            return;
        }

        // Simple phone validation (must be numbers)
        if (!/^\d+$/.test(phone)) {
            messageDiv.textContent = '⚠️ Phone number must contain only digits.';
            messageDiv.className = 'message error';
            messageDiv.style.display = 'block';
            return;
        }

        // Disable button to prevent double-click
        const btn = this;
        btn.textContent = '⏳ Adding...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, vehicle })
            });

            const data = await response.json();

            if (response.status === 201) {
                // Success!
                messageDiv.textContent = `✅ ${name} registered successfully! Rider ID: ${data.rider_id}`;
                messageDiv.className = 'message success';
                messageDiv.style.display = 'block';
                
                // Clear the form fields
                document.getElementById('riderName').value = '';
                document.getElementById('riderPhone').value = '';
                
                // Optional: Show a quick toast-like effect
                alert(`✅ ${name} is now a real rider! Go to the homepage and click "Find Riders" to see them.`);
            } else {
                // Error from server (e.g., duplicate phone)
                messageDiv.textContent = '❌ ' + (data.error || 'Registration failed.');
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Error:', error);
            messageDiv.textContent = '❌ Network error. Make sure your server is running.';
            messageDiv.className = 'message error';
            messageDiv.style.display = 'block';
        }

        // Re-enable button
        btn.textContent = '➕ Add Rider to System';
        btn.disabled = false;
    });
</script>

</body>
</html>
